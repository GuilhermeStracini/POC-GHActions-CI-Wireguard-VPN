name: Test VPN
on:
  pull_request:
  workflow_dispatch:

jobs:
 test-vpn:
    # Pinned to 24.04 on purpose. ubuntu-latest moved to Ubuntu 26.04, where this job
    # began hanging in the apt-get install step: the runner is reaped after ~20 min with
    # no logs and the run ends as "cancelled". A separate job on the same image
    # (infisical-secrets-check) installs packages fine, so this is the intermittent
    # 26.04 apt hang tracked in actions/runner-images#14716, not something in this
    # workflow. 24.04 has been green here for months. Revisit ubuntu-latest once that
    # image issue is resolved.
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: cURL without VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=without-vpn-1

    - name: Attach WireGuard connection
      shell: bash
      env:
        WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      run: |
        sudo apt-get install -y resolvconf
        sudo apt-get install -y wireguard
        if [[ -z "$WIREGUARD_CONFIG" ]]; then
          echo "::notice::WIREGUARD_CONFIG is empty (Dependabot and fork runs do not receive repository secrets) - wg0 will come up without peers."
        fi
        # Keep the config under /etc/wireguard: Ubuntu 25.10+ confines wg-quick with an
        # AppArmor profile that only allows config files there. This is harmless on 24.04
        # and means a future move to a newer runner won't hit the "Permission denied"
        # that ./wg0.conf would cause.
        (umask 077 && printf '%s\n' "$WIREGUARD_CONFIG" > "$RUNNER_TEMP/wg0.conf")
        sudo install -d -m 700 /etc/wireguard
        sudo install -m 600 "$RUNNER_TEMP/wg0.conf" /etc/wireguard/wg0.conf
        rm -f "$RUNNER_TEMP/wg0.conf"
        sudo wg-quick up wg0

    - name: cURL with VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=with-vpn-1

    - name: Detach WireGuard connection
      shell: bash
      run: |
        sudo wg-quick down wg0
        sudo rm -f /etc/wireguard/wg0.conf

    - name: cURL without VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=without-vpn-2
