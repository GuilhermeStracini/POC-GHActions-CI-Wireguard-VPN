name: Test VPN
on:
  pull_request:
  workflow_dispatch:

jobs:
 test-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

    - name: Checkout code
      uses: actions/checkout@v7

    - name: cURL without VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=without-vpn-1

    - name: Install WireGuard
      shell: bash
      # ubuntu-latest is now Ubuntu 26.04, where needrestart runs after every apt
      # operation in "Ubuntu mode" and restarts services automatically. On the hosted
      # image that includes hosted-compute-agent.service - the service this very job
      # runs under - so a restart kills the runner and the job hangs until GitHub
      # times it out, with no logs. Nothing on a throwaway VM needs restarting, so
      # needrestart is suspended for the apt calls (NEEDRESTART_SUSPEND is its
      # documented switch for that).
      run: |
        echo "::group::Services needrestart would restart (read-only check)"
        sudo needrestart -b -r l 2>&1 | grep -E '^NEEDRESTART-(SVC|KSTA)' || true
        echo "::endgroup::"
        timeout -k 10 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y resolvconf
        timeout -k 10 300 sudo env DEBIAN_FRONTEND=noninteractive NEEDRESTART_SUSPEND=1 apt-get install -y wireguard

    - name: Attach WireGuard connection
      shell: bash
      env:
        WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
      run: |
        if [[ -z "$WIREGUARD_CONFIG" ]]; then
          echo "::notice::WIREGUARD_CONFIG is empty (Dependabot and fork runs do not receive repository secrets) - wg0 will come up without peers."
        fi
        # Ubuntu 25.10+ confines wg-quick with an AppArmor profile that only allows
        # configuration files under /etc/wireguard, so the config can no longer live in
        # the workspace. Write it as the runner user first, then move it into place as
        # root with the right ownership and mode.
        (umask 077 && printf '%s\n' "$WIREGUARD_CONFIG" > "$RUNNER_TEMP/wg0.conf")
        sudo install -d -m 700 /etc/wireguard
        sudo install -m 600 "$RUNNER_TEMP/wg0.conf" /etc/wireguard/wg0.conf
        rm -f "$RUNNER_TEMP/wg0.conf"
        # Watchdog: if wg-quick stalls, show which process is stuck (and in what state)
        # instead of hanging silently until the job timeout.
        (
          for _ in $(seq 1 90); do sleep 1; [[ -e "$RUNNER_TEMP/wg-quick.done" ]] && exit 0; done
          echo "::group::wg-quick is taking too long - sudo/wg-quick process tree"
          ps -eo pid,ppid,pgid,tpgid,tty,stat,wchan:20,cmd --forest | grep -E 'PID|sudo|wg-quick|wg |ip |resolvconf|resolvectl' || true
          echo "::endgroup::"
        ) &
        watchdog=$!
        rc=0
        timeout -k 10 120 sudo wg-quick up wg0 || rc=$?
        touch "$RUNNER_TEMP/wg-quick.done"
        wait "$watchdog" 2>/dev/null || true
        exit "$rc"

    - name: cURL with VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=with-vpn-1

    - name: Detach WireGuard connection
      shell: bash
      run: |
        timeout -k 10 60 sudo wg-quick down wg0
        sudo rm -f /etc/wireguard/wg0.conf

    - name: cURL without VPN
      run: |
        curl -A "POC-GHActions-CI-Wireguard-VPN" ${{ secrets.WEBHOOK_ENDPOINT }}?type=without-vpn-2
